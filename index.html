<!DOCTYPE html>
<html lang="es" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EURO - Sistema de Gestión de Terceros</title>
    <meta name="description" content="Sistema empresarial para gestión de terceros, proveedores y empleados" />
    <meta name="author" content="EURO" />

    <meta property="og:title" content="EURO - Sistema de Gestión de Terceros" />
    <meta property="og:description" content="Sistema empresarial para gestión de terceros, proveedores y empleados" />
    <meta property="og:type" content="website" />

    <!-- Tailwind CDN con configuración mejorada -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Colores que se adaptan automáticamente al tema
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))'
              },
              popover: {
                DEFAULT: 'hsl(var(--popover))',
                foreground: 'hsl(var(--popover-foreground))'
              },
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))'
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))'
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))'
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))'
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))'
              },
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              success: {
                DEFAULT: 'hsl(var(--success))',
                foreground: 'hsl(var(--success-foreground))'
              },
              warning: {
                DEFAULT: 'hsl(var(--warning))',
                foreground: 'hsl(var(--warning-foreground))'
              },
              info: {
                DEFAULT: 'hsl(var(--info))',
                foreground: 'hsl(var(--info-foreground))'
              },
              corporate: {
                blue: 'hsl(var(--corporate-blue))',
                'blue-dark': 'hsl(var(--corporate-blue-dark))',
                gray: 'hsl(var(--corporate-gray))',
                light: 'hsl(var(--corporate-light))'
              }
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)'
            }
          }
        }
      }

      // Script para inicializar el tema antes de que cargue React
      (function() {
        const theme = localStorage.getItem('euro-theme') || 'light';
        const root = document.documentElement;
        
        root.classList.remove('light', 'dark');
        
        if (theme === 'system') {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(prefersDark ? 'dark' : 'light');
        } else {
          root.classList.add(theme);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
